<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gaby</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #03060f;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="orbe"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/webgpu": "./vendor/three.module.js",
    "three/tsl": "./vendor/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// Gaby es un orbe de partículas, no un rostro: emite un pulso por cada palabra
// que habla y cambia de color según su estado de ánimo. Mismo lenguaje visual
// que el ícono de la app.
//
// El resplandor sale de sprites con degradado radial y mezcla aditiva, en vez
// de una cadena de postprocesado (EffectComposer): se ve prácticamente igual y
// evita cargar esas dependencias dentro de la app.

const R = 1.0;
const POINT_COUNT = 420;
const MAX_DIST = 0.26;
const MAX_NEIGHBORS = 3;

// Misma paleta que la web (src/components/gabyOrbShared.ts + src/theme.ts).
const EMOCIONES = {
  neutral:    { color: '#22D3EE', velocidad: 2600 },
  feliz:      { color: '#34D399', velocidad: 1800 },
  enojo:      { color: '#F87171', velocidad: 900 },
  tristeza:   { color: '#8B93B0', velocidad: 3600 },
  mareado:    { color: '#7C5CFC', velocidad: 550 },
  confundido: { color: '#22D3EE', velocidad: 2000 },
};

function esferaFibonacci(count) {
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = golden * i;
    pts.push(new THREE.Vector3(Math.cos(th) * r * R, y * R, Math.sin(th) * r * R));
  }
  return pts;
}

function texturaResplandor() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grad.addColorStop(0.0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.16, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.42, 'rgba(255,255,255,0.25)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const base = esferaFibonacci(POINT_COUNT);

const canvas = document.getElementById('orbe');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);

const grupo = new THREE.Group();
scene.add(grupo);

let emocion = 'neutral';
let hablando = false;
/** Pulsos activos: cada uno es el instante en que empezó. */
let pulsos = [];

const colorBase = new THREE.Color(EMOCIONES[emocion].color);
const colorClaro = new THREE.Color('#EAFBFF');

const posiciones = new Float32Array(POINT_COUNT * 3);
const colores = new Float32Array(POINT_COUNT * 3);
const tamanos = new Float32Array(POINT_COUNT);
const tamanoBase = new Float32Array(POINT_COUNT);

base.forEach((p, i) => {
  posiciones[i*3] = p.x; posiciones[i*3+1] = p.y; posiciones[i*3+2] = p.z;
  tamanoBase[i] = 0.030 + Math.random() * 0.012;
  tamanos[i] = tamanoBase[i];
});

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colores, 3));
geo.setAttribute('aSize', new THREE.BufferAttribute(tamanos, 1));

const material = new THREE.ShaderMaterial({
  uniforms: { uTexture: { value: texturaResplandor() }, uScale: { value: 800 } },
  vertexShader: `
    attribute float aSize;
    uniform float uScale;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uScale / -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D uTexture;
    varying vec3 vColor;
    void main() {
      gl_FragColor = vec4(vColor, 1.0) * texture2D(uTexture, gl_PointCoord);
    }`,
  transparent: true,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
grupo.add(new THREE.Points(geo, material));

// Malla entre puntos vecinos. Los índices se guardan para poder mover las
// líneas junto con los puntos cuando pasa un pulso.
const aristas = [];
const vistos = new Set();
for (let i = 0; i < base.length; i++) {
  const cand = [];
  for (let j = 0; j < base.length; j++) {
    if (i === j) continue;
    const d = base[i].distanceTo(base[j]);
    if (d <= MAX_DIST) cand.push({ j, d });
  }
  cand.sort((a, b) => a.d - b.d);
  for (const { j } of cand.slice(0, MAX_NEIGHBORS)) {
    const k = i < j ? i+'-'+j : j+'-'+i;
    if (vistos.has(k)) continue;
    vistos.add(k);
    aristas.push([i, j]);
  }
}
const posLineas = new Float32Array(aristas.length * 6);
const geoLineas = new THREE.BufferGeometry();
geoLineas.setAttribute('position', new THREE.BufferAttribute(posLineas, 3));
const materialLineas = new THREE.LineBasicMaterial({
  color: colorBase, transparent: true, opacity: 0.22,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
grupo.add(new THREE.LineSegments(geoLineas, materialLineas));

const MEDIO_ANCHO = R * 1.3;
const MEDIO_ALTO = R * 1.3;

function ajustar() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  // La cámara se aleja lo justo para que el orbe entre completo, de alto y de
  // ancho: con una distancia fija queda cortado en pantallas angostas.
  const mitadFov = THREE.MathUtils.degToRad(camera.fov) / 2;
  const tan = Math.tan(mitadFov);
  camera.position.z = Math.max(MEDIO_ALTO / tan, MEDIO_ANCHO / (tan * camera.aspect));
  camera.updateProjectionMatrix();

  material.uniforms.uScale.value = (h * dpr) / (2 * tan) * 1.6;
}
window.addEventListener('resize', ajustar);
ajustar();

const DURACION_PULSO = 1.25;
const reloj = new THREE.Clock();
const v = new THREE.Vector3();

/** Onda que viaja del centro hacia afuera: 0 antes de llegar, sube y baja al pasar. */
function ondaPulso(edad, latitud) {
  if (edad < 0 || edad > DURACION_PULSO) return 0;
  const avance = edad / DURACION_PULSO;
  // El frente recorre el orbe de abajo hacia arriba en coordenadas normalizadas.
  const frente = avance * 2.2 - 0.6;
  const distancia = Math.abs(latitud - frente);
  const ancho = 0.42;
  if (distancia > ancho) return 0;
  const forma = Math.cos((distancia / ancho) * Math.PI / 2);
  // Se apaga hacia el final para que el pulso se disuelva en vez de cortarse.
  return forma * forma * (1 - avance);
}

function animar() {
  const t = reloj.getElapsedTime();
  const meta = EMOCIONES[emocion] || EMOCIONES.neutral;

  // Respiración: más rápida cuando la emoción es más intensa.
  const respiracion = 0.5 + 0.5 * Math.sin((t * 2 * Math.PI) / (meta.velocidad / 1000));

  grupo.rotation.y = t * 0.16;
  grupo.rotation.x = Math.sin(t * 0.4) * 0.12;

  pulsos = pulsos.filter((inicio) => t - inicio <= DURACION_PULSO);

  const posAttr = geo.getAttribute('position');
  const colorAttr = geo.getAttribute('color');
  const sizeAttr = geo.getAttribute('aSize');

  for (let i = 0; i < POINT_COUNT; i++) {
    const p = base[i];
    // Latitud normalizada a 0..1, que es por donde viaja la onda.
    const latitud = (p.y / R + 1) / 2;

    let energia = 0;
    for (const inicio of pulsos) {
      energia += ondaPulso(t - inicio, latitud);
    }
    energia = Math.min(energia, 1.6);

    // El pulso empuja los puntos hacia afuera, en su propia dirección radial.
    const escala = 1 + energia * 0.22 + respiracion * 0.015;
    v.copy(p).multiplyScalar(escala);
    posAttr.setXYZ(i, v.x, v.y, v.z);

    // Y los enciende: el frente de onda se ve como luz recorriendo el orbe.
    const brillo = 0.55 + respiracion * 0.12 + energia * 0.9;
    const c = colorBase.clone().lerp(colorClaro, Math.min(energia * 0.8, 0.9));
    colorAttr.setXYZ(i, c.r * brillo, c.g * brillo, c.b * brillo);

    sizeAttr.setX(i, tamanoBase[i] * (1 + energia * 0.55));
  }
  posAttr.needsUpdate = true;
  colorAttr.needsUpdate = true;
  sizeAttr.needsUpdate = true;

  // Las líneas siguen a los puntos ya desplazados.
  for (let e = 0; e < aristas.length; e++) {
    const [a, b] = aristas[e];
    posLineas[e*6]   = posAttr.getX(a);
    posLineas[e*6+1] = posAttr.getY(a);
    posLineas[e*6+2] = posAttr.getZ(a);
    posLineas[e*6+3] = posAttr.getX(b);
    posLineas[e*6+4] = posAttr.getY(b);
    posLineas[e*6+5] = posAttr.getZ(b);
  }
  geoLineas.getAttribute('position').needsUpdate = true;
  materialLineas.opacity = 0.18 + (hablando ? 0.14 : 0) + respiracion * 0.05;

  renderer.render(scene, camera);
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

// Puente con la app nativa: HomeView.swift las llama con evaluateJavaScript.
window.gabySetEmotion = (nombre) => {
  if (!EMOCIONES[nombre]) return;
  emocion = nombre;
  colorBase.set(EMOCIONES[nombre].color);
  materialLineas.color.set(EMOCIONES[nombre].color);
};

window.gabySetSpeaking = (valor) => {
  hablando = !!valor;
};

/** Un pulso por cada palabra hablada: así el orbe late al ritmo de la voz. */
window.gabyTalkPulse = () => {
  pulsos.push(reloj.getElapsedTime());
};
</script>
</body>
</html>
