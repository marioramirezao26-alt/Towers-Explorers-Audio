; Proyecto PlatformIO para el Stack-chan que habla con el backend de Gaby (Cloud
; Function deviceCommand). Ver README.md en esta carpeta para la guía de armado
; y las credenciales que hay que completar en secrets.h.
;
; Nota: el repo "oficial" meganetaaan/stack-chan usa Moddable SDK (JavaScript),
; un entorno mucho más pesado de instalar. En vez de eso usamos la librería
; M5Stack-Avatar (del mismo autor) sobre Arduino/PlatformIO, que es el camino
; que sigue la mayoría de los Stack-chan caseros y es mucho más simple de armar.
; M5Stack-Avatar soporta oficialmente Core, Core2 y CoreS3 — hay un entorno para
; cada una de las dos placas más comunes; compila el que corresponda a tu hardware
; con "pio run -e <nombre>" o eligiéndolo en la barra inferior de PlatformIO/VS Code.

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.1.16
    https://github.com/meganetaaan/m5stack-avatar.git
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.1.0

; M5Stack CoreS3 (ESP32-S3, pantalla táctil 2", doble micrófono y bocina
; integrados) — el que trae la caja "StackChan Core" que muestra micrófono/bocina
; integrados en vez del M5Stack Core2 genérico.
[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.1.16
    https://github.com/meganetaaan/m5stack-avatar.git
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.1.0
