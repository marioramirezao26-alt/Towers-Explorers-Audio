; Proyecto PlatformIO para el Stack-chan (M5Stack Core2) que habla con el backend
; de Gaby (Cloud Function deviceCommand). Ver README.md en esta carpeta para la
; guía de armado y las credenciales que hay que completar en secrets.h.
;
; Nota: el repo "oficial" meganetaaan/stack-chan usa Moddable SDK (JavaScript),
; un entorno mucho más pesado de instalar. En vez de eso usamos la librería
; M5Stack-Avatar (del mismo autor) sobre Arduino/PlatformIO, que es el camino
; que sigue la mayoría de los Stack-chan caseros y es mucho más simple de armar.

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.1.16
    https://github.com/meganetaaan/m5stack-avatar.git
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.1.0
