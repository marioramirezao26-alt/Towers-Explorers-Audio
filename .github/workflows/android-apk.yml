name: APK de Android

# Compila Gaby como APK instalable y lo deja descargable desde la pestaña
# "Actions" del repo (dentro del run, en "Artifacts"). Sirve para instalarlo en
# el teléfono sin cables ni tiendas: se descarga y se abre.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "src/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    # Las credenciales viven en los secretos del repo, no en el código: este
    # repositorio es público y dejarlas ahí permitiría que cualquiera consumiera
    # la cuota del proyecto de Firebase.
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar el SDK de Android
        # El runner ya trae el SDK instalado, así que no hace falta una acción
        # que lo instale (la que se probaba fallaba pidiendo un paquete
        # "tools" que Google ya retiró). Solo falta el NDK exacto que pide
        # React Native 0.74 para compilar las partes en C++.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" > /dev/null

      - name: Comprobar que están las credenciales
        # Expo incrusta las variables EXPO_PUBLIC_* dentro del APK en el momento
        # de compilar. Sin ellas la app se instala pero muere al abrir, porque
        # Firebase arranca con la configuración vacía. Mejor fallar aquí, con un
        # mensaje claro, que entregar un APK roto.
        run: |
          if [ -z "${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}" ]; then
            echo "::error::Faltan los secretos de Firebase. Agrégalos en Settings → Secrets and variables → Actions (ver ios-native/../README). Sin ellos el APK se instala pero no abre."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Generar el proyecto Android
        # android/ no se versiona: lo genera prebuild desde app.json.
        run: npx expo prebuild --platform android --no-install

      - name: Compilar el APK
        working-directory: android
        # Se compila universal (las cuatro arquitecturas) a propósito: pesa más,
        # pero instala en cualquier teléfono sin tener que averiguar cuál lleva.
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar para que se reconozca al descargarlo
        run: cp android/app/build/outputs/apk/release/app-release.apk Gaby.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gaby-apk
          path: Gaby.apk
          retention-days: 90
