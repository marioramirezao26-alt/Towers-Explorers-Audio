name: iOS build check

# Compila el proyecto de ios-native/ en un runner de macOS de GitHub, para saber
# si el código Swift compila sin necesitar una Mac propia — el CI es el único
# lugar donde se verifica esto hasta que se prueba en una Mac real (Xcode/EAS).
# Sin firma (CODE_SIGNING_ALLOWED=NO): solo confirma que compila, no genera un
# build instalable — para eso sí hace falta una Mac con una cuenta de Apple.

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Mostrar versión de Xcode disponible
        run: xcodebuild -version

      - name: Usar Secrets de ejemplo (placeholders vacíos, no reales)
        working-directory: ios-native
        run: cp Scowld/Core/Secrets.swift.example Scowld/Core/Secrets.swift

      - name: Confiar en los plugins de macros SPM (sin diálogo interactivo)
        # Xcode pide confirmar "Trust and Enable" la primera vez que un paquete
        # usa un macro/build-tool plugin (aquí, MetaCodable, dependencia
        # transitiva de swift-realtime-openai). En CI no hay diálogo posible,
        # así que se aprueba de antemano vía defaults — es el mecanismo que
        # usa Xcode mismo para recordar el consentimiento entre builds.
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Compilar (sin firma, para simulador)
        # "generic/platform=iOS Simulator" no era la causa real del error de
        # macros (esa fue la versión de swift-syntax, ya fijada arriba) —
        # sí es la forma correcta y estable de decirle a xcodebuild "solo
        # compila, no elijas ni necesites un simulador concreto ya creado",
        # que varía de un runner/imagen a otro.
        working-directory: ios-native
        run: |
          xcodebuild build \
            -project Scowld.xcodeproj \
            -scheme Scowld \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
