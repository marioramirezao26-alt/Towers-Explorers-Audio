name: App de Windows

# Compila Gaby para Windows: el orbe flotando siempre encima del escritorio, y
# la app completa a un clic. Se ejecuta sin instalar.
#
# El resultado se publica en el Release "pc-latest", que es un enlace fijo y no
# cambia de una versión a otra. Descargar desde "Artifacts" exige navegador,
# sesión iniciada y encontrar el recuadro al final del run; desde el Release
# basta un Invoke-WebRequest, y esa diferencia en la práctica es la que decide
# si la versión nueva acaba instalada o no.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "desktop/**"
      - "ios-native/Scowld/Resources/amica.bundle/**"
      - ".github/workflows/pc-windows.yml"

jobs:
  exe:
    runs-on: windows-latest
    # Necesario para publicar el Release desde el propio flujo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: desktop
        # npm install y no npm ci: desktop/ no lleva package-lock propio, para
        # no arrastrar un segundo candado de dependencias en el repo.
        run: npm install

      - name: Compilar el .exe
        working-directory: desktop
        # copiar-orbe.mjs trae el orbe desde donde vive (el visor de iOS) antes
        # de empaquetar; ver ese archivo.
        run: npm run empaquetar

      - uses: actions/upload-artifact@v4
        with:
          name: Gaby-windows
          path: |
            desktop/dist/Gaby-carpeta.zip
            desktop/dist/Gaby-portable.exe
          retention-days: 90

      - name: Publicar en el Release de descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        # Se borra y se recrea en vez de actualizarlo: así "releases/latest"
        # apunta siempre a esta compilación, que es lo que hace que el enlace de
        # descarga no cambie nunca. El `|| true` es para la primera vez, cuando
        # todavía no hay nada que borrar.
        run: |
          gh release delete pc-latest --yes --cleanup-tag || true
          gh release create pc-latest `
            desktop/dist/Gaby-carpeta.zip `
            desktop/dist/Gaby-portable.exe `
            --title "Gaby para Windows" `
            --notes "Compilado desde ${{ github.sha }}.

          Instalar (PowerShell):

              Invoke-WebRequest https://github.com/${{ github.repository }}/releases/latest/download/Gaby-carpeta.zip -OutFile \$env:TEMP\Gaby.zip
              Expand-Archive \$env:TEMP\Gaby.zip -DestinationPath C:\Gaby -Force
              C:\Gaby\Gaby.exe"
